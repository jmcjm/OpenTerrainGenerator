#######################################################################
# |                           Biome Groups                          | #
#######################################################################

# Vanilla-like biome distribution
# Format: BiomeGroup(Name, GenerationDepth, Rarity, Biomes..., TempMin, TempMax)
# GenerationDepth: All main groups at 0 so they compete for same space
# Rarity: How common the group is (higher = more common)
# Temperature ranges prevent incompatible biomes from neighboring

# Main land biomes - all at depth 0 to form large regions
BiomeGroup(NormalBiomes, 0, 100, Forest, Dark Forest, Plains, Birch Forest, Swamp, Flower Forest, Sunflower Plains, Tall Birch Forest, Cherry Grove, Meadow, Mangrove Swamp, 0.5, 0.95)
BiomeGroup(ColdBiomes, 2, 60, Forest, Mountains, Taiga, Plains, Flower Forest, Gravelly Mountains, Taiga Mountains, Grove, 0.2, 0.5)
BiomeGroup(HotBiomes, 1, 65, Desert, Savanna, Plains, Sunflower Plains, Stony Peaks, 1.0, 2.0)

# Frozen biomes - slightly less common
BiomeGroup(IceBiomes, 1, 25, Snowy Tundra, Snowy Mountains, Ice Spikes, Snowy Taiga, Snowy Taiga Mountains, Snowy Slopes, -0.5, 0.2)

# Rare special biomes - higher depth = smaller isolated regions
BiomeGroup(MesaBiomes, 2, 8, Badlands, 1.5, 2.0)
BiomeGroup(JungleBiomes, 2, 10, Jungle, Bamboo Jungle, 0.9, 1.0)
BiomeGroup(Mega TaigaBiomes, 2, 12, Giant Tree Taiga, Giant Spruce Taiga, 0.25, 0.35)

BlacklistedBiomes: biomesoplenty:tropic_beach, byg:canyon_edge, byg:red_desert_dunes


#######################################################################
